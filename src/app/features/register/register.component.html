<section class="p-4 h-full">
  <form
    #registrationForm="ngForm"
    (ngSubmit)="onSubmit(registrationForm)"
    class="glass-card h-full flex flex-col justify-between text-text-primary px-12! py-8!"
  >
    <div class="form-section">
      <h2 class="form-heading">Personal Details</h2>

      <div class="form-grid">
        <div class="form-field">
          <label for="fname">First Name</label>
          <input
            [(ngModel)]="formData.fname"
            type="text"
            id="fname"
            name="fname"
            class="form-input"
          />
        </div>

        <div class="form-field">
          <label for="lname">Last Name</label>
          <input
            [(ngModel)]="formData.lname"
            type="text"
            id="lname"
            name="lname"
            class="form-input"
          />
        </div>

        <div class="form-field pointer-events-none">
          <label for="id">ID</label>
          <input type="number" id="id" name="id" class="form-input" />
        </div>

        <div class="form-field">
          <label for="location">Location</label>

          <select
            [(ngModel)]="formData.location"
            name="location"
            id="location"
            class="form-input rounded-md"
          >
            @for (location of locations; track $index) {
              <option [value]="location" class="text-text-primary bg-gray-700 border-0">
                {{ location }}
              </option>
            }
          </select>
        </div>

        <div class="form-field">
          <label for="role">Role</label>

          <select [(ngModel)]="formData.role" name="role" id="role" class="form-input">
            @for (role of roles; track $index) {
              <option [value]="role" class="text-text-primary bg-gray-700 border-0 rounded-md">
                {{ role }}
              </option>
            }
          </select>
        </div>

        <div class="form-field">
          <label for="phone">Phone Number</label>

          <input
            [(ngModel)]="formData.phoneNumber"
            type="text"
            id="phone"
            name="phone"
            class="form-input"
          />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2 class="form-heading">Login Details</h2>
      <div class="form-grid">
        <div class="form-field col-span-2">
          <label for="email">Email</label>
          <input
            [(ngModel)]="formData.email"
            type="email"
            id="email"
            name="email"
            class="form-input"
          />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input
            [(ngModel)]="formData.password"
            type="password"
            id="password"
            name="password"
            class="form-input"
          />
        </div>
        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            [(ngModel)]="formData.confirmPassword"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
          />
        </div>
      </div>
    </div>

    <button type="submit" class="submit-btn">Register</button>
  </form>
</section>

@if (isModalOpen()) {
  <app-register-popup (onCloseRequest)="closeModal()"></app-register-popup>
}
